name: brook_peeler_module
services:
  brooks_peeler:
    container_name: brooks_peeler
    image: ghcr.io/ad-sdl/brooks_xpeel_module
    network_mode: host
    privileged: true
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - NODE_DEVICE_PORT=/dev/ttyUSB4
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - ghcr.io/ad-sdl/brooks_xpeel_module:latest
        - ghcr.io/ad-sdl/brooks_xpeel_module:dev
    volumes:
      - ./definitions:/home/madsci/definitions/
